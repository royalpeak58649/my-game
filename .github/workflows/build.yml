name: Build

on:
  push:
    branches: [fixer-city]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon -Pmod_version=0.1.${{ github.run_number }} 2>&1 | tee build.log

      - name: Fetch boss mod (L_Ender's Cataclysm) for the smoke test
        run: python3 .github/scripts/fetch_boss_mod.py run/mods && ls -la run/mods

      - name: Server smoke test (load mod, registries, recipes, receptions with Cataclysm)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          ./gradlew runServer --no-daemon -Pmod_version=0.1.${{ github.run_number }} > server.log 2>&1 &
          for i in $(seq 1 180); do
            grep -qE 'fixercity smoke: (all|some)' server.log && break
            grep -qE 'Crash report|Failed to start' server.log && break
            sleep 5
          done
          pkill -f 'net.neoforged' || true; pkill -f GradleWrapperMain || true; sleep 3
          grep -E "(ERROR|WARN)\]|Exception|Couldn't|Parsing error" server.log | grep -i -E "fixercity|recipe|registry|Exception" | head -80 > smoke.txt || true
          echo "--- smoke findings ---"; cat smoke.txt
          grep -q 'Done (' server.log || { echo "server did not start"; tail -80 server.log >> smoke.txt; exit 1; }
          grep "fixercity smoke" server.log || true
          if grep -qi fixercity smoke.txt; then echo "mod errors found"; exit 1; fi
          grep -q "fixercity smoke: city generation OK" server.log || { echo "city smoke check did not pass"; exit 1; }
          grep -q "fixercity smoke: library receptions OK" server.log || { echo "library smoke check did not pass"; exit 1; }
          grep -q "fixercity smoke: city events OK" server.log || { echo "events smoke check did not pass"; exit 1; }

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

      - name: Publish jar as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fixercity-build-${{ github.run_number }}
          name: Fixer City build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            자동 빌드 #${{ github.run_number }} (${{ github.sha }})
            `fixercity-0.1.${{ github.run_number }}.jar` 를 마인크래프트 `mods` 폴더에 넣으세요 (예전 fixercity jar는 지우기). NeoForge 1.21.1 필요.
            도서관의 접대(보스전)에는 L_Ender's Cataclysm (NeoForge 1.21.1)이 필요합니다.
          files: build/libs/fixercity-*.jar

      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Commit: ${{ github.sha }}"
            echo '```'
            grep -E "error:|warning:|FAILED|What went wrong|\.java:[0-9]+" build.log | head -150 || true
            echo '--- smoke test ---'
            cat smoke.txt 2>/dev/null || true
            echo '--- tail ---'
            tail -60 build.log || true
            echo '```'
          } > report.md
          gh issue create --repo "${{ github.repository }}" --title "[fixer-city] build failed #${{ github.run_number }}" --body-file report.md
