name: Build

on:
  push:
    branches: [fixer-city]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Server smoke test (load mod, registries, recipes)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          ./gradlew runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 120); do
            grep -qE 'fixercity smoke: (all|some)' server.log && break
            grep -qE 'Crash report|Failed to start' server.log && break
            sleep 5
          done
          pkill -f 'net.neoforged' || true; pkill -f GradleWrapperMain || true; sleep 3
          grep -E "(ERROR|WARN)\]|Exception|Couldn't|Parsing error" server.log | grep -i -E "fixercity|recipe|registry|Exception" | head -80 > smoke.txt || true
          echo "--- smoke findings ---"; cat smoke.txt
          grep -q 'Done (' server.log || { echo "server did not start"; tail -80 server.log >> smoke.txt; exit 1; }
          grep "fixercity smoke" server.log || true
          if grep -qi fixercity smoke.txt; then echo "mod errors found"; exit 1; fi
          grep -q "fixercity smoke: city generation OK" server.log || { echo "city smoke check did not pass"; exit 1; }

      - name: Publish jar as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fixercity-build-${{ github.run_number }}
          name: Fixer City build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            자동 빌드 (${{ github.sha }})
            `fixercity-*.jar` 파일을 마인크래프트 `mods` 폴더에 넣으세요. NeoForge 1.21.1 필요.
          files: build/libs/fixercity-*.jar

      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Commit: ${{ github.sha }}"
            echo '```'
            grep -E "error:|warning:|FAILED|What went wrong|\.java:[0-9]+" build.log | head -150 || true
            echo '--- smoke test ---'
            cat smoke.txt 2>/dev/null || true
            echo '--- tail ---'
            tail -60 build.log || true
            echo '```'
          } > report.md
          gh issue create --repo "${{ github.repository }}" --title "[fixer-city] build failed #${{ github.run_number }}" --body-file report.md
